name: Autobuild (Latest)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 注释掉 ntdllp.lib 引用，避免 LNK1104
      - name: Fix ntdllp.lib issue
        shell: pwsh
        run: |
          $file = "CVE-2024-35250\exploit.h"
          (Get-Content $file) -replace '#pragma comment\(lib, "ntdllp\.lib"\)', '// #pragma comment(lib, "ntdllp.lib")' | Set-Content $file

      # 构建 CVE-2024-35250（即使失败也继续）
      - name: Build CVE-2024-35250
        continue-on-error: true
        run: |
          msbuild CVE-2024-35250\CVE-2024-35250.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      # 构建 CVE-2026-62735（即使失败也继续）
      - name: Build CVE-2026-62735
        continue-on-error: true
        run: |
          msbuild CVE-2026-62735\CVE-2026-62735.vcxproj /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      # 收集所有成功生成的 .exe（不因缺失而报错）
      - name: Collect artifacts
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item -Path "CVE-2024-35250\x64\Release\*.exe" -Destination artifacts\ -ErrorAction SilentlyContinue
          Copy-Item -Path "CVE-2026-62735\x64\Release\*.exe" -Destination artifacts\ -ErrorAction SilentlyContinue

      # 上传构建产物（若无文件则忽略）
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: artifacts/
          if-no-files-found: ignore